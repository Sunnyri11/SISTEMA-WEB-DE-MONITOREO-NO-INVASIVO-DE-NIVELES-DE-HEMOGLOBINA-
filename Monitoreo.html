<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Monitoreo - Hemoglobina</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #93c5fd, #60a5fa, #3b82f6, #1e40af);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    .container {
      display: flex;
      width: 90%;
      max-width: 1100px;
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .left-section, .right-section {
      flex: 1;
      padding: 30px;
    }
    .left-section {
      border-right: 2px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    h1 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 20px;
    }
    .paciente-info {
      background: #f0f9ff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #bae6fd;
    }
    .paciente-info p {
      margin: 8px 0;
      font-size: 15px;
      color: #374151;
    }
    .estado {
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      text-align: center;
    }
    .estado.estable { background: #d4edda; color: #155724; }
    .estado.anemia { background: #fff3cd; color: #856404; }
    .estado.poliglobulia { background: #f8d7da; color: #721c24; }
    .btn {
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-logout { background-color: #ef4444; color: #fff; }
    .btn-logout:hover { background-color: #dc2626; }
    .btn-update { background-color: #2563eb; color: #fff; }
    .btn-update:hover { background-color: #1e40af; }
    canvas {
      margin-top: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .btn-reportes {
      display: block;
      margin: 30px auto 0 auto;
      padding: 12px 20px;
      background-color: #38bdf8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-reportes:hover {
      background-color: #0ea5e9;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sección izquierda: datos del paciente -->
    <div class="left-section">
      <div>
        <h1>Sistema de Monitoreo</h1>
        <div class="paciente-info" id="infoPaciente">
          <!-- Datos cargados desde localStorage -->
        </div>
      </div>
      <div>
        <button class="btn btn-update" onclick="actualizarDatos()">Actualizar Datos</button>
        <button class="btn btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
      </div>
    </div>

    <!-- Sección derecha: gráficos -->
    <div class="right-section">
      <h3>Niveles de Hemoglobina</h3>
      <canvas id="graficoHemoglobina"></canvas>

      <h3>Temperatura Corporal</h3>
      <canvas id="graficoTemperatura"></canvas>

      <button class="btn-reportes">Ver Reportes Históricos</button>
    </div>
  </div>

  <script>
    // Recuperar paciente desde localStorage
    const pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];
    const paciente = pacientes[pacientes.length - 1]; 

    const infoDiv = document.getElementById("infoPaciente");
    if (paciente) {
      infoDiv.innerHTML = `
        <p><strong>Nombre:</strong> ${paciente.nombre || "N/A"} ${paciente.apellido_paterno || ""} ${paciente.apellido_materno || ""}</p>
        <p><strong>Correo:</strong> ${paciente.email || paciente.correo || "N/A"}</p>
        <p><strong>Rol:</strong> ${paciente.rol || "Paciente"}</p>
        <div id="estadoPaciente" class="estado">Estado: Estable</div>
      `;
    } else {
      infoDiv.innerHTML = "<p>No hay datos de paciente registrados.</p>";
    }

    // Datos simulados iniciales
    let nivelesHemoglobina = [14, 13.5, 12, 11.5, 10.8]; // g/dL
    let nivelesTemperatura = [36.5, 36.7, 37.2, 37.5, 38]; // °C

    // Estado del paciente
    function actualizarEstado() {
      const ultimaHemoglobina = nivelesHemoglobina[nivelesHemoglobina.length - 1];
      const estadoDiv = document.getElementById("estadoPaciente");
      if (estadoDiv) {
        if (ultimaHemoglobina < 12) {
          estadoDiv.textContent = "Estado: Alerta de Anemia";
          estadoDiv.className = "estado anemia";
        } else if (ultimaHemoglobina > 17) {
          estadoDiv.textContent = "Estado: Alerta de Poliglobulia";
          estadoDiv.className = "estado poliglobulia";
        } else {
          estadoDiv.textContent = "Estado: Estable";
          estadoDiv.className = "estado estable";
        }
      }
    }

    // Gráficos
    const ctxHemo = document.getElementById("graficoHemoglobina");
    const ctxTemp = document.getElementById("graficoTemperatura");

    const chartHemo = new Chart(ctxHemo, {
      type: "line",
      data: {
        labels: ["Medición 1", "Medición 2", "Medición 3", "Medición 4", "Medición 5"],
        datasets: [{
          label: "Hemoglobina (g/dL)",
          data: nivelesHemoglobina,
          borderColor: "#2563eb",
          backgroundColor: "rgba(37,99,235,0.2)",
          fill: true,
          tension: 0.3
        }]
      }
    });

    const chartTemp = new Chart(ctxTemp, {
      type: "line",
      data: {
        labels: ["Medición 1", "Medición 2", "Medición 3", "Medición 4", "Medición 5"],
        datasets: [{
          label: "Temperatura (°C)",
          data: nivelesTemperatura,
          borderColor: "#ef4444",
          backgroundColor: "rgba(239,68,68,0.2)",
          fill: true,
          tension: 0.3
        }]
      }
    });

    actualizarEstado();

    // Botón actualizar datos (simulación)
    function actualizarDatos() {
      nivelesHemoglobina.push((Math.random() * (18 - 10) + 10).toFixed(1));
      nivelesTemperatura.push((Math.random() * (39 - 36) + 36).toFixed(1));

      const nuevaEtiqueta = "Medición " + nivelesHemoglobina.length;
      chartHemo.data.labels.push(nuevaEtiqueta);
      chartTemp.data.labels.push(nuevaEtiqueta);

      chartHemo.data.datasets[0].data = nivelesHemoglobina;
      chartTemp.data.datasets[0].data = nivelesTemperatura;

      chartHemo.update();
      chartTemp.update();

      actualizarEstado();
    }

    // Botón cerrar sesión
    function cerrarSesion() {
      window.location.href = "Login.html";
    }
  </script>
</body>
</html>
