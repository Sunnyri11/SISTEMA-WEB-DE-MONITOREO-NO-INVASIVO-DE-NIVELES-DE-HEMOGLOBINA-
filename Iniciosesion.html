<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Análisis - Ingreso y Registro</title>
    <style>
        /* ====== ESTILOS BÁSICOS DE LA PÁGINA ====== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* ====== CONTENEDOR PRINCIPAL ====== */
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        /* ====== ENCABEZADO ====== */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #1f2937;
        }
        .header p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: #6b7280;
        }

        /* ====== ESTRUCTURA DEL FORMULARIO ====== */
        .form-group {
            margin-bottom: 16px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        /* ====== ENTRADAS DE TEXTO Y SELECTS ====== */
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background-color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        /* ====== SECCIÓN DE REGISTRO ====== */
        .divider {
            border-top: 1px solid #e5e7eb;
            margin: 20px 0;
            padding-top: 16px;
        }
        .divider-title {
            font-size: 11px;
            font-weight: 600;
            color: #7c3aed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        /* ====== BOTONES ====== */
        .btn-primary {
            width: 100%;
            background-color: #7c3aed;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn-primary:hover {
            background-color: #6d28d9;
        }

        .btn-secondary {
            width: 100%;
            background-color: #ffffff;
            color: #7c3aed;
            border: 1px solid #ddd6fe;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
        }
        .btn-secondary:hover {
            background-color: #f9fafb;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Encabezado -->
        <div class="header">
            <h1>Sistema de Análisis</h1>
            <p>Registro e Ingreso</p>
        </div>

        <form action="#" method="POST">
            
            <!-- ====== LOGIN REQUERIDO ====== -->
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" required name="email" placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" required name="password" placeholder="••••••••">
            </div>

            <!-- ====== SECCIÓN DE REGISTRO ====== -->
            <div class="divider">
                <div class="divider-title">Datos de Registro</div>


                <!-- Selección de Rol -->
                <div class="form-group">
                    <label>Rol en el Sistema</label>
                    <select name="rol">
                        <option value="" disabled selected>Selecciona tu rol</option>
                        <option value="paciente">Paciente</option>
                        <option value="medico">Médico</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>

                <!-- Ubicación (Departamento y Ciudad) -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Departamento</label>
                        <select id="departamento" name="departamento" onchange="cargarCiudades()">
                            <option value="" disabled selected>Seleccionar</option>
                            <option value="dep1">La Paz/option>
                            <option value="dep2">Oruro</option>
                            <option value="dep2">Choca</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <select id="ciudad" name="ciudad">
                            <option value="" disabled selected>Elegir dpto.</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ====== ACCIONES ====== -->
            <button type="submit" name="accion" value="login" class="btn-primary">
                Iniciar Sesión
            </button>
            
            <button type="submit" name="accion" value="registro" class="btn-secondary">
                Registrar nuevo paciente
            </button>

        </form>
    </div>

    <!-- Script básico para cargar ciudades dinámicamente -->
    <script>
        const ciudadesPorDepartamento = {
            dep1: ["Ciudad A1", "Ciudad A2", "Ciudad A3"],
            dep2: ["Ciudad B1", "Ciudad B2"]
        };

        function cargarCiudades() {
            const deptoSelect = document.getElementById("departamento");
            const ciudadSelect = document.getElementById("ciudad");
            const deptoSeleccionado = deptoSelect.value;

            // Limpiar ciudades anteriores
            ciudadSelect.innerHTML = '<option value="" disabled selected>Seleccionar ciudad</option>';

            if (ciudadesPorDepartamento[deptoSeleccionado]) {
                ciudadesPorDepartamento[deptoSeleccionado].forEach(ciudad => {
                    const option = document.createElement("option");
                    option.value = ciudad.toLowerCase().replace(" ", "_");
                    option.textContent = ciudad;
                    ciudadSelect.appendChild(option);
                });
            }
        }
    </script>
</body>
</html>
