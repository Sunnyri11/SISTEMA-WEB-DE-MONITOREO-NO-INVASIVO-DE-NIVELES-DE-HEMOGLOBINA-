<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Paciente - Hemoglobina</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f3f0f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(92, 59, 143, 0.08);
    }

    .header-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title h1 {
      font-size: 24px;
      color: #242424;
      font-weight: 700;
    }

    .header-title p {
      font-size: 14px;
      color: #6d647a;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #433d4e;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #dcd3e6;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #674fa3;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 4px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background-color: #674fa3;
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #553e8a;
    }

    .helper-text {
      font-size: 11px;
      color: #7b7485;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-title">
    <h1>Sistema de Análisis</h1>
    <p>Registro de Nuevo Paciente</p>
  </div>

  <form id="formRegistro">
    <div class="form-group">
      <label for="nombre">Nombre(s)</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej. Carlos">
    </div>
    
    <div class="row-2">
      <div class="form-group">
        <label for="apellido_paterno">Apellido Paterno</label>
        <input type="text" id="apellido_paterno" name="apellido_paterno" required placeholder="Ej. Pérez">
      </div>
      <div class="form-group">
        <label for="apellido_materno">Apellido Materno</label>
        <input type="text" id="apellido_materno" name="apellido_materno" required placeholder="Ej. Gómez">
      </div>
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Género biológico</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="genero" value="M" checked> Hombre
          </label>
          <label class="radio-option">
            <input type="radio" name="genero" value="F"> Mujer
          </label>
        </div>
      </div>
      <div class="form-group">
        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
      </div>
    </div>

    <!-- Sección Geográfica y Altitud -->
    <div class="row-2">
      <div class="form-group">
        <label for="departamento">Departamento</label>
        <select id="departamento" name="departamento" onchange="cargarProvincias()" required>
          <option value="" disabled selected>Seleccione...</option>
          <option value="La Paz">La Paz</option>
          <option value="Oruro">Oruro</option>
          <option value="Potosí">Potosí</option>
          <option value="Cochabamba">Cochabamba</option>
          <option value="Chuquisaca">Chuquisaca</option>
          <option value="Tarija">Tarija</option>
          <option value="Santa Cruz">Santa Cruz</option>
          <option value="Beni">Beni</option>
          <option value="Pando">Pando</option>
        </select>
      </div>

      <div class="form-group">
        <label for="provincia">Provincia</label>
        <select id="provincia" name="provincia" onchange="actualizarAltitud()" required>
          <option value="" disabled selected>Seleccione depto primero</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="altitud">Altitud (m.s.n.m.)</label>
      <input type="number" id="altitud" name="altitud" placeholder="Ej. 3600" required>
      <span class="helper-text">Modificable según la localidad exacta (ej. valle, yungas o altiplano).</span>
    </div>

    <div class="form-group">
      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-submit">Registrar Paciente</button>
  </form>
</div>

<script>
  // Diccionario con Departamentos, sus Provincias y la altitud promedio en m.s.n.m.
  // Puedes expandir esta lista con el resto de provincias para tu base de datos (PostgreSQL/Laravel).
  const datosGeograficos = {
    "La Paz": {
      "Murillo": 3640,
      "Aroma": 3900,
      "Nor Yungas": 1500,
      "Sud Yungas": 1700,
      "Los Andes": 3800,
      "Omasuyos": 3820
    },
    "Cochabamba": {
      "Cercado": 2570,
      "Quillacollo": 2425,
      "Chapare": 400,
      "Punata": 2730
    },
    "Santa Cruz": {
      "Andrés Ibáñez": 416,
      "Warnes": 340,
      "Chiquitos": 296,
      "Cordillera": 800
    },
    "Oruro": {
      "Cercado": 3710,
      "Avaroa": 3750
    },
    "Potosí": {
      "Tomás Frías": 4060,
      "Quijarro": 3670
    },
    "Chuquisaca": {
      "Oropeza": 2790,
      "Zudáñez": 2450
    },
    "Tarija": {
      "Cercado": 1870,
      "Gran Chaco": 600
    },
    "Beni": {
      "Cercado": 160,
      "Vaca Díez": 140
    },
    "Pando": {
      "Nicolás Suárez": 205,
      "Manuripi": 170
    }
  };

  function cargarProvincias() {
    const deptoSeleccionado = document.getElementById('departamento').value;
    const selectProvincia = document.getElementById('provincia');
    const inputAltitud = document.getElementById('altitud');

    // Limpiar provincias y altitud anteriores
    selectProvincia.innerHTML = '<option value="" disabled selected>Seleccione provincia</option>';
    inputAltitud.value = '';

    if (deptoSeleccionado && datosGeograficos[deptoSeleccionado]) {
      const provincias = datosGeograficos[deptoSeleccionado];
      
      // Llenar el nuevo select de provincias
      for (const prov in provincias) {
        let option = document.createElement('option');
        option.value = prov;
        option.textContent = prov;
        selectProvincia.appendChild(option);
      }
    }
  }

  function actualizarAltitud() {
    const deptoSeleccionado = document.getElementById('departamento').value;
    const provinciaSeleccionada = document.getElementById('provincia').value;
    const inputAltitud = document.getElementById('altitud');

    if (deptoSeleccionado && provinciaSeleccionada) {
      const altitud = datosGeograficos[deptoSeleccionado][provinciaSeleccionada];
      if (altitud !== undefined) {
        inputAltitud.value = altitud;
      }
    }
  }

  document.getElementById('formRegistro').addEventListener('submit', function(e) {
    e.preventDefault();

    const dataPaciente = {
      nombre: document.getElementById('nombre').value,
      apellido_paterno: document.getElementById('apellido_paterno').value,
      apellido_materno: document.getElementById('apellido_materno').value,
      genero: document.querySelector('input[name="genero"]:checked').value,
      fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
      departamento: document.getElementById('departamento').value,
      provincia: document.getElementById('provincia').value,
      altitud: parseFloat(document.getElementById('altitud').value),
      correo: document.getElementById('correo').value,
      password: document.getElementById('password').value
    };

    console.log("Datos para enviar al backend:", dataPaciente);
  });
</script>

</body>
</html>
